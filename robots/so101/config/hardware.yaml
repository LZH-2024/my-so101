leader:
  type: so101_leader
  # port: /dev/ttyACM1
  port: COM4
  id: leader01
  calibration_dir: robots/so101/calibration/leader
  use_degrees: true

follower:
  type: so101_follower
  # port: /dev/ttyACM0
  port: COM5
  id: follower01
  calibration_dir: robots/so101/calibration/follower
  use_degrees: true
  disable_torque_on_disconnect: true
  max_relative_target: null

cameras:
  wrist:
    type: opencv
    # index_or_path: /dev/video0
    index_or_path: 0
    width: 640
    height: 480
    fps: &camera_fps 30

  front:
    type: opencv
    # index_or_path: /dev/video2
    index_or_path: 1
    width: 640
    height: 480
    fps: *camera_fps
